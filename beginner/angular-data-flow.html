<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angular data flow — how components talk to each other</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1c; --bg2:#101430; --card:#141935; --card2:#171d3d;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
  --ink:#ecEEfb; --mut:#98a0c8; --dim:#69719e;
  --ok:#3ddc97;     /* quiz: right answer */
  --no:#ff5470;     /* quiz: wrong answer */
  --down:#ff2e88;   /* data going DOWN: parent -> child */
  --up:#2ee6c5;     /* data going UP: child -> parent */
  --side:#ffb020;   /* sideways: service / siblings */
  --route:#8b6cff;  /* across routes */
  --ts:#4a9eff; --html:#ff7a45;
  --disp:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --rail:236px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1100px 700px at 78% -10%,rgba(139,108,255,.14),transparent 60%),
    radial-gradient(900px 600px at 4% 108%,rgba(255,46,136,.10),transparent 60%),
    var(--bg);
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:var(--down);color:#fff}

/* ---------- shell ---------- */
.deck{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;height:100dvh}
.rail{
  border-right:1px solid var(--line2);background:rgba(8,10,22,.55);
  display:flex;flex-direction:column;min-height:0;
}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line2)}
.brand b{
  display:block;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em;
  background:linear-gradient(92deg,#e40035,#f20089 45%,#9717e2);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.rail-list{overflow:auto;padding:10px 10px 18px;flex:1;min-height:0;scrollbar-width:thin}
.rail-btn{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;color:var(--dim);font-family:var(--body);font-size:13px;
  padding:7px 10px;border-radius:8px;line-height:1.3;position:relative;
}
.rail-btn em{font-family:var(--mono);font-style:normal;font-size:10.5px;opacity:.6;min-width:16px}
.rail-btn:hover{color:var(--mut);background:rgba(255,255,255,.035)}
.rail-btn[aria-current="true"]{color:var(--ink);background:rgba(255,255,255,.06)}
.rail-btn[aria-current="true"]::before{
  content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,#f20089,#9717e2);
}
.rail-foot{padding:12px 20px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.7}
kbd{font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--mut)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.viewport{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}
.slide{display:none;padding:34px clamp(20px,3.4vw,54px) 40px;max-width:1220px;margin:0 auto}
.slide.on{display:block;animation:rise .45s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- slide head ---------- */
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.num{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.16em}
.badge{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;border:1px solid currentColor;color:var(--c);
  background:color-mix(in srgb,var(--c) 12%,transparent);
}
h1.title{
  font-family:var(--disp);font-weight:800;letter-spacing:-.03em;line-height:1.02;
  font-size:clamp(28px,4vw,46px);margin:0 0 10px;
}
h1.title code{font-family:var(--mono);font-size:.82em;font-weight:600;color:var(--c)}
.lead{color:var(--mut);max-width:74ch;margin:0 0 22px;font-size:15.5px}
.lead b{color:var(--ink);font-weight:600}

/* ---------- stage / diagram ---------- */
.stage{position:relative;margin:6px 0 4px;padding:26px 8px;display:flex;flex-direction:column;gap:74px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.row{display:flex;justify-content:center;gap:clamp(92px,7vw,120px);flex-wrap:wrap;position:relative;z-index:2}
.node{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:12px;padding:11px 15px;min-width:172px;
  box-shadow:0 10px 26px -18px #000, inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.node .role{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.node .file{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.node .file b{font-weight:600}
.node[data-kind="ts"] .file b{color:var(--ts)}
.node[data-kind="html"] .file b{color:var(--html)}
.node[data-kind="svc"] .file b{color:var(--side)}
.node[data-kind="cfg"] .file b{color:var(--route)}
.node.active{border-color:color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent),0 0 34px -8px var(--c);transform:translateY(-2px)}
.edge path.wire{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1.6}
.edge path.flow{fill:none;stroke:var(--c);stroke-width:2.2;stroke-dasharray:5 9;opacity:0;stroke-linecap:round}
.edge.lit path.wire{stroke:color-mix(in srgb,var(--c) 40%,transparent)}
.edge.lit path.flow{opacity:1;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-28}}
.edge text{font-family:var(--mono);font-size:10.5px;fill:var(--dim);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.edge.lit text{fill:var(--c)}
.packet{opacity:0}
.packet rect{fill:var(--c);rx:6}
.packet text{font-family:var(--mono);font-size:11px;font-weight:600;fill:#0b0d1c;stroke:none}

/* ---------- step bar ---------- */
.stepbar{
  display:flex;align-items:center;gap:14px;margin:8px 0 22px;padding:11px 14px;
  border:1px solid var(--line2);border-radius:11px;background:rgba(255,255,255,.03);
}
.stepbar .dots{display:flex;gap:6px;flex-shrink:0}
.stepbar .dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.16);cursor:pointer;border:0;padding:0;transition:.2s}
.stepbar .dot.on{background:var(--c);box-shadow:0 0 10px -1px var(--c);transform:scale(1.25)}
.stepbar .cap{flex:1;min-width:0;font-size:14px;color:var(--ink)}
.stepbar .cap span{color:var(--dim);font-family:var(--mono);font-size:11px;margin-right:8px}
.iconbtn{
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut);
  border-radius:8px;padding:5px 11px;font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;
}
.iconbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--c) 55%,transparent)}

/* ---------- code cards ---------- */
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.fc{background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden;transition:border-color .3s}
.fc.active{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.fc-h{
  display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line2);
  background:rgba(255,255,255,.025);font-family:var(--mono);font-size:11.5px;color:var(--mut);
}
.fc-h .d{width:7px;height:7px;border-radius:99px;flex-shrink:0}
.fc[data-lang="ts"] .d{background:var(--ts)} .fc[data-lang="html"] .d{background:var(--html)}
.fc-h .tag{margin-left:auto;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:12.2px;line-height:1.72;scrollbar-width:thin}
.ln{display:block;padding:0 15px;white-space:pre;border-left:2px solid transparent;transition:background .25s,border-color .25s}
.ln.hl{background:color-mix(in srgb,var(--c) 13%,transparent);border-left-color:var(--c)}
.t-key{color:#c792ea}.t-str{color:#9be58a}.t-com{color:#5d6591;font-style:italic}
.t-dec{color:#ffcb6b}.t-tag{color:#ff7a91}.t-bind{color:#7fd4ff}.t-int{color:#ffd479}.t-num{color:#f78c6c}

/* ---------- real example ---------- */
.example{margin-top:26px;padding-top:18px;border-top:1px solid var(--line2)}
.exhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:7px}
.extag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--c);border:1px solid currentColor;border-radius:99px;padding:3px 9px;
  background:color-mix(in srgb,var(--c) 12%,transparent);
}
.exhead b{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink)}
.exlead{margin:0 0 14px;color:var(--mut);font-size:14px;max-width:82ch}

/* ---------- gotchas ---------- */
.gotchas{margin-top:20px;border-top:1px solid var(--line2);padding-top:16px}
.gotchas h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:500}
.gotchas ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:9px 22px}
.gotchas li{position:relative;padding-left:20px;font-size:13.6px;color:var(--mut)}
.gotchas li::before{content:"!";position:absolute;left:0;top:0;font-family:var(--mono);font-size:11px;color:var(--c);font-weight:700}
.gotchas li b{color:var(--ink);font-weight:600}
code.i{font-family:var(--mono);font-size:.9em;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;color:#cfd6ff}

/* ---------- hud ---------- */
.hud{
  display:flex;align-items:center;gap:14px;padding:10px clamp(16px,3vw,28px);
  border-top:1px solid var(--line2);background:rgba(8,10,22,.6);backdrop-filter:blur(8px);
}
.bar{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e40035,#f20089,#9717e2);transition:width .4s cubic-bezier(.2,.7,.3,1)}
.hud .pos{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:52px}
.nav{display:flex;gap:6px}

/* ---------- title slide ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:74vh}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(38px,5.6vw,68px);line-height:.98;letter-spacing:-.04em;margin:0 0 18px}
.hero h1 em{font-style:normal;background:linear-gradient(92deg,#e40035,#f20089 45%,#9717e2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:16.5px;max-width:52ch}
.legend{display:flex;flex-direction:column;gap:9px;margin:26px 0 30px}
.legend div{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--mut)}
.legend i{width:26px;height:3px;border-radius:99px;display:block;flex-shrink:0}
.cta{
  display:inline-flex;align-items:center;gap:10px;background:linear-gradient(92deg,#f20089,#9717e2);
  color:#fff;border:0;border-radius:10px;padding:12px 22px;font-family:var(--body);font-weight:600;font-size:14.5px;cursor:pointer;
  box-shadow:0 14px 34px -16px #f20089;
}
.cta:hover{filter:brightness(1.08)}
.cta2{background:none;border:1px solid var(--line);color:var(--mut);box-shadow:none;margin-left:10px}
.cta2:hover{filter:none;color:var(--ink);border-color:color-mix(in srgb,var(--route) 55%,transparent)}
.demo{position:relative;height:340px;border:1px solid var(--line2);border-radius:16px;background:
  linear-gradient(180deg,rgba(255,255,255,.035),transparent),
  repeating-linear-gradient(0deg,transparent 0 27px,rgba(255,255,255,.022) 27px 28px)}
.demo .lbl{position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.demo-in{position:absolute;inset:42px 22px 22px;display:flex;flex-direction:column;align-items:center}
.dbox{width:100%;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 15px;font-family:var(--mono);font-size:12.5px;text-align:center}
.dbox b{color:var(--ts)}
.dbox span{display:block;font-family:var(--body);font-size:11.5px;color:var(--dim);margin-top:2px}
.dwires{display:flex;gap:78px;flex:1;padding:16px 0}
.dw{position:relative;width:2px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.15),transparent)}
.dw i{position:absolute;left:50%;width:10px;height:10px;border-radius:99px;margin-left:-5px}
.dw i.down{background:var(--down);box-shadow:0 0 18px 2px var(--down);animation:godown 2.8s cubic-bezier(.55,0,.45,1) infinite}
.dw i.up{background:var(--up);box-shadow:0 0 18px 2px var(--up);animation:goup 2.8s cubic-bezier(.55,0,.45,1) infinite;animation-delay:1.4s}
.dw em{position:absolute;top:50%;left:16px;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;font-style:normal;color:var(--dim);white-space:nowrap}
.dw:last-child em{left:auto;right:16px}
@keyframes godown{0%{top:-6px;opacity:0}14%{opacity:1}86%{opacity:1}100%{top:calc(100% - 4px);opacity:0}}
@keyframes goup{0%{top:calc(100% - 4px);opacity:0}14%{opacity:1}86%{opacity:1}100%{top:-6px;opacity:0}}

/* ---------- map slide ---------- */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:13px}
.mapcard{
  text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px 17px;cursor:pointer;
  color:var(--ink);font-family:var(--body);transition:.22s;position:relative;overflow:hidden;
}
.mapcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.55}
.mapcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 50%,transparent);background:var(--card2)}
.mapcard .q{font-size:14.5px;font-weight:600;margin-bottom:7px;display:block;line-height:1.35}
.mapcard .a{font-family:var(--mono);font-size:11.5px;color:var(--c)}
.mapcard .w{font-size:12.5px;color:var(--dim);margin-top:6px;display:block}
.mapcard .ex{
  display:block;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);
  font-family:var(--mono);font-size:11px;color:var(--mut);line-height:1.5;
}
.mapcard .ex i{
  display:block;font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:3px;
}

/* ---------- table / checklist ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.tbl th{
  text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:500;padding:0 14px 9px;border-bottom:1px solid var(--line);
}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--mut)}
.tbl td:first-child{color:var(--ink);width:31%}
.tbl tr:hover td{background:rgba(255,255,255,.022)}
.tbl code{font-family:var(--mono);font-size:11.8px;color:#cfd6ff}
.check{display:grid;gap:11px;counter-reset:c;margin-top:8px}
.chk{display:flex;gap:14px;background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:14px 16px}
.chk .n{counter-increment:c;font-family:var(--mono);font-size:11px;color:var(--c);padding-top:2px}
.chk .n::before{content:counter(c,decimal-leading-zero)}
.chk b{display:block;font-size:14.5px;margin-bottom:4px}
.chk p{margin:0;color:var(--mut);font-size:13.4px}
.sechead{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:28px 0 12px}

/* ---------- plain words + picture strip ---------- */
.say{
  display:flex;gap:13px;align-items:flex-start;margin:0 0 12px;padding:13px 16px;
  border:1px solid var(--line2);border-radius:11px;background:rgba(255,255,255,.03);
}
.say .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);flex-shrink:0;padding-top:4px}
.say p{margin:0;font-size:14.6px;line-height:1.6;color:var(--ink);max-width:88ch}
.say p b{color:var(--c);font-weight:600}

.strip{
  display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 22px;
  border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--card);
}
.strip .pan{
  position:relative;padding:17px 17px 16px;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:10px;border-left:1px solid var(--line2);
}
.strip .pan:first-child{border-left:0}
.strip .pan svg{width:38px;height:38px;fill:none;stroke:var(--c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.strip .pan p{margin:0;font-size:13.4px;line-height:1.55;color:var(--mut)}
.strip .pan p b{color:var(--ink);font-weight:600}
.strip .pan .step{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.strip .pan + .pan::before{
  content:"";position:absolute;left:-6px;top:50%;width:11px;height:11px;margin-top:-6px;
  border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);
  transform:rotate(45deg);background:var(--card);
}
.edge text.plain{font-size:9.5px;fill:var(--mut);letter-spacing:.01em;opacity:.85}
.edge.lit text.plain{fill:var(--mut);opacity:1}

@media (max-width:900px){
  .strip{grid-template-columns:1fr}
  .strip .pan{border-left:0;border-top:1px solid var(--line2);flex-direction:row;text-align:left;gap:14px}
  .strip .pan:first-child{border-top:0}
  .strip .pan svg{width:30px;height:30px;flex-shrink:0}
  .strip .pan + .pan::before{left:50%;top:-6px;margin:0 0 0 -6px;transform:rotate(135deg)}
  .say{flex-direction:column;gap:6px}
}

/* ---------- back into the Beginner track ---------- */
.hud a.deckout{
  display:inline-block;width:auto;flex:none;font-family:var(--mono);font-size:10.5px;
  color:var(--mut);text-decoration:none;white-space:nowrap;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;
}
.hud a.deckout:hover{color:var(--ink);border-color:color-mix(in srgb,var(--route) 55%,transparent)}
.hud .bar{min-width:70px}
@media (max-width:1100px){.hud a.deckout[data-side]{display:none}}

/* ---------- quiz ---------- */
.quiz{display:grid;gap:14px}
.qbar{
  position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;
  padding:11px 14px;border:1px solid var(--line2);border-radius:11px;
  background:rgba(11,13,28,.9);backdrop-filter:blur(10px);
}
.qbar .qtxt{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.qbar .qtxt b{color:var(--ink);font-weight:600}
.qbar .qtxt em{font-style:normal;color:var(--ok);font-weight:600}
.qmeter{flex:1;min-width:60px;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.qmeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--ok));transition:width .35s cubic-bezier(.2,.7,.3,1)}

.qcard{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:17px 19px;transition:border-color .3s}

.qcard.wrong{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
.qhead{display:flex;gap:13px;align-items:baseline;margin-bottom:13px}
.qnum{font-family:var(--mono);font-size:11px;color:var(--c);flex-shrink:0}
.qask{font-size:15px;line-height:1.45;color:var(--ink);font-weight:500}
.qcode{border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:12px;background:rgba(0,0,0,.24)}

     font-family:var(--mono);font-size:11px;color:var(--dim)}
.qcode pre{font-size:12px;padding:10px 0}

.opts{display:grid;gap:8px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.028);border:1px solid var(--line2);border-radius:9px;
  padding:10px 13px;color:var(--mut);font-family:var(--body);font-size:13.8px;line-height:1.45;transition:.18s;
}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);
        border-radius:5px;padding:0 6px;flex-shrink:0;line-height:1.55}
.opt .ot{flex:1;min-width:0}
.opt .mark{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;flex-shrink:0;line-height:1.9}
.opt:hover{color:var(--ink);background:rgba(255,255,255,.055);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.qcard.done .opt,.qcard.done .opt:hover{cursor:default;background:rgba(255,255,255,.028);border-color:var(--line2);color:var(--mut)}
.qcard.done .opt.ok{color:var(--ink);border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.qcard.done .opt.ok .k{color:var(--ok);border-color:currentColor}
.qcard.done .opt.ok .mark{color:var(--ok)}
.qcard.done .opt.ok .mark::after{content:"right answer"}
.qcard.done .opt.no{color:var(--ink);border-color:color-mix(in srgb,var(--no) 55%,transparent);background:color-mix(in srgb,var(--no) 10%,transparent)}
.qcard.done .opt.no .k{color:var(--no);border-color:currentColor}
.qcard.done .opt.no .mark{color:var(--no)}
.qcard.done .opt.no .mark::after{content:"you picked"}

.why{
  display:flex;gap:13px;align-items:flex-start;flex-wrap:wrap;margin-top:13px;padding:13px 15px;
  border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.028);

}
.why[hidden]{display:none}
.why .wt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);flex-shrink:0;padding-top:3px}
.why p{margin:0;flex:1;min-width:230px;font-size:13.6px;line-height:1.65;color:var(--mut)}
.why p b{color:var(--ink);font-weight:600}

.qend{
  border:1px solid var(--line2);border-radius:12px;padding:20px;text-align:center;
  background:linear-gradient(180deg,var(--card2),var(--card));
}
.qend .sc{display:block;font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--ink)}
.qend p{margin:6px 0 14px;color:var(--mut);font-size:13.6px}
.qend .revs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}

<script>
/* ============================================================
   SLIDE DATA
   nodes  -> boxes in the animated diagram (one box = one file)
   edges  -> the wires a value travels along
   files  -> the real code, line-highlighted per step
   steps  -> the story, one beat at a time
   ============================================================ */
const C = { down:'var(--down)', up:'var(--up)', side:'var(--side)', route:'var(--route)' };

const SLIDES = [

/* 00 ------------------------------------------------------- */
{ kind:'title', rail:'Start', c:C.down },

/* 01 ------------------------------------------------------- */
{ kind:'map', rail:'Which one do I need?', num:'01', c:C.route,
  title:'Start here: match your situation',
  lead:'Almost every "why is my data not arriving" bug comes from using the wrong channel for the relationship between two components. Pick the sentence that describes your case.' },

/* 02 ------------------------------------------------------- */
{
  analogy:{
    say:`The parent is a <b>manager</b>. It writes the value on a note, keeps the original, and hands a copy down to the child. The child only reads the note — it never decides what is written on it.`,
    strip:[
      {ic:'note', t:`The <b>parent</b> holds the value. Nobody else has it yet.`},
      {ic:'down', t:`It hands a copy down through the tag: <b>[user]="user"</b>.`},
      {ic:'person', t:`The <b>child</b> receives it and draws it. That is all it does.`}]},
  id:'input', num:'02', rail:'@Input — down', c:C.down, badge:'Parent → Child',
  title:'Pass data <code>down</code> with @Input()',
  lead:'Use it when the child tag is written inside the parent template. The parent stays the owner of the value; the child only displays what it is given.',
  nodes:[
    [{id:'pts',role:'owns the state',file:'parent.component',ext:'.ts',kind:'ts'},
     {id:'phtml',role:'binds it',file:'parent.component',ext:'.html',kind:'html'}],
    [{id:'chtml',role:'displays it',file:'child.component',ext:'.html',kind:'html'},
     {id:'cts',role:'receives it',file:'child.component',ext:'.ts',kind:'ts'}]
  ],
  edges:[
    {id:'e1',from:'pts',to:'phtml',a:'right',b:'left',label:'user',packet:'user',plain:'it lives here'},
    {id:'e2',from:'phtml',to:'cts',a:'bottom',b:'top',label:'[user]="user"',packet:'{ name }',plain:'it crosses into the child'},
    {id:'e3',from:'cts',to:'chtml',a:'left',b:'right',label:'{{ }}',packet:'Sara',plain:'prints it'}
  ],
  files:[
    {id:'pts',name:'parent.component.ts',lang:'ts',tag:'source',code:[
      "import { Component } from '@angular/core';",
      "import { ChildComponent } from './child.component';",
      "",
      "@Component({",
      "  selector: 'app-parent',",
      "  imports: [ChildComponent],   // standalone: you MUST import it",
      "  templateUrl: './parent.component.html',",
      "})",
      "export class ParentComponent {",
      "  user = { name: 'Sara', role: 'admin' };   // the source of truth",
      "}"]},
    {id:'phtml',name:'parent.component.html',lang:'html',tag:'the wire',code:[
      "<!--  [childProperty]=\"parentProperty\"  -->",
      "<app-child [user]=\"user\"></app-child>",
      "",
      "<!-- no brackets = a plain string, not a property -->",
      "<app-child title=\"Hello\"></app-child>"]},
    {id:'cts',name:'child.component.ts',lang:'ts',tag:'receiver',code:[
      "import { Component, Input } from '@angular/core';",
      "",
      "@Component({ selector: 'app-child', templateUrl: './child.component.html' })",
      "export class ChildComponent {",
      "  @Input() user!: { name: string; role: string };",
      "  @Input() title = '';",
      "",
      "  ngOnInit() {",
      "    console.log(this.user);   // ready here, NOT in the constructor",
      "  }",
      "}"]},
    {id:'chtml',name:'child.component.html',lang:'html',tag:'output',code:[
      "<h3>{{ user.name }}</h3>",
      "<p>{{ user.role }}</p>"]},
    {id:'mod',name:'child.component.ts — Angular 17+',lang:'ts',tag:'modern',code:[
      "import { Component, input } from '@angular/core';",
      "",
      "export class ChildComponent {",
      "  user = input.required<User>();   // no decorator, it is a signal",
      "  title = input('');               // optional, with a default",
      "",
      "  // read it as a function, everywhere:",
      "  //   template   {{ user().name }}",
      "  //   class      this.user().role",
      "}"]}
  ],
  steps:[
    {t:'The parent owns the value. Nothing is shared yet.',hl:{pts:[10]}},
    {t:'Angular renders the parent template. [user] reads the property sitting next to it in the same class.',edge:'e1',hl:{phtml:[1,2]}},
    {t:'The value crosses the component boundary and lands on the child\u2019s @Input property.',edge:'e2',hl:{cts:[5]}},
    {t:'The child template renders it. Change user in the parent and this updates by itself.',edge:'e3',hl:{chtml:[1,2]}}
  ],
  example:{
    name:'Product grid on a shop page',
    what:'The grid page owns the array and the currency. Each card knows how to draw exactly one product and nothing else — which is why the same card also works in "related products" and in search results.',
    files:[
      {id:'x1',name:'product-grid.component.html',lang:'html',tag:'the list',code:[
        "@for (p of products(); track p.id) {",
        "  <app-product-card",
        "    [product]=\"p\"",
        "    [currency]=\"currency\"",
        "    [soldOut]=\"p.stock === 0\">",
        "  </app-product-card>",
        "}"]},
      {id:'x2',name:'product-card.component.ts',lang:'ts',tag:'receiver',code:[
        "export class ProductCardComponent {",
        "  @Input({ required: true }) product!: Product;",
        "  @Input() currency = 'USD';",
        "  @Input({ transform: booleanAttribute }) soldOut = false;",
        "",
        "  // modern equivalent:",
        "  // product  = input.required<Product>();",
        "  // currency = input('USD');",
        "}"]},
      {id:'x3',name:'product-card.component.html',lang:'html',tag:'output',code:[
        "<img [src]=\"product.image\" [alt]=\"product.title\">",
        "<h4>{{ product.title }}</h4>",
        "<span>{{ product.price | currency: currency }}</span>",
        "",
        "@if (soldOut) { <em class=\"tag\">Out of stock</em> }"]}
    ]
  },
  gotchas:[
    '@Input values are <b>undefined in the constructor</b>. Read them in <code class="i">ngOnInit</code> or later.',
    'The binding name must match the property name, or alias it: <code class="i">@Input(\'userData\') user</code>.',
    'Objects travel <b>by reference</b> — mutating <code class="i">user</code> in the child also changes the parent\u2019s object.',
    'To react to a new value: <code class="i">ngOnChanges()</code>, a setter, or <code class="i">effect()</code> with signal inputs.',
    'Forgetting the child in <code class="i">imports: []</code> renders nothing and logs nothing. Check this first.'
  ]
},

/* 03 ------------------------------------------------------- */
{
  analogy:{
    say:`The child is an <b>employee who rings a bell</b>. It does not touch the parent's data. It announces "this just happened", and the manager decides what to do about it.`,
    strip:[
      {ic:'person', t:`Something happens inside the <b>child</b> — a click, a submit.`},
      {ic:'up', t:`The child rings the bell upward: <b>emit(value)</b>.`},
      {ic:'bell', t:`The <b>parent</b> was listening with <b>(saved)</b> and reacts.`}]},
  id:'output', num:'03', rail:'@Output — up', c:C.up, badge:'Child → Parent',
  title:'Send events <code>up</code> with @Output()',
  lead:'The child never changes the parent\u2019s data itself. It announces "this happened", and the parent decides what to do about it.',
  nodes:[
    [{id:'pts',role:'reacts',file:'parent.component',ext:'.ts',kind:'ts'},
     {id:'phtml',role:'listens',file:'parent.component',ext:'.html',kind:'html'}],
    [{id:'chtml',role:'the click',file:'child.component',ext:'.html',kind:'html'},
     {id:'cts',role:'emits',file:'child.component',ext:'.ts',kind:'ts'}]
  ],
  edges:[
    {id:'e1',from:'chtml',to:'cts',a:'right',b:'left',label:'(click)',packet:'click',plain:'the user does something'},
    {id:'e2',from:'cts',to:'phtml',a:'top',b:'bottom',label:'emit(text)',packet:'"hello"',plain:'the child shouts upward'},
    {id:'e3',from:'phtml',to:'pts',a:'left',b:'right',label:'$event',packet:'$event',plain:'the parent catches it'}
  ],
  files:[
    {id:'chtml',name:'child.component.html',lang:'html',tag:'trigger',code:[
      "<input [value]=\"text\" (input)=\"text = $any($event.target).value\">",
      "<button (click)=\"save()\">Save</button>"]},
    {id:'cts',name:'child.component.ts',lang:'ts',tag:'sender',code:[
      "import { Component, Output, EventEmitter } from '@angular/core';",
      "",
      "export class ChildComponent {",
      "  text = '';",
      "  @Output() saved = new EventEmitter<string>();",
      "",
      "  save() {",
      "    this.saved.emit(this.text);   // fire it upwards",
      "  }",
      "}"]},
    {id:'phtml',name:'parent.component.html',lang:'html',tag:'the wire',code:[
      "<!--  (childOutput)=\"parentMethod($event)\"  -->",
      "<app-child (saved)=\"onSaved($event)\"></app-child>",
      "",
      "<p>Last saved: {{ log }}</p>"]},
    {id:'pts',name:'parent.component.ts',lang:'ts',tag:'handler',code:[
      "export class ParentComponent {",
      "  log = '';",
      "",
      "  onSaved(value: string) {   // $event IS the emitted payload",
      "    this.log = value;",
      "  }",
      "}"]},
    {id:'mod',name:'child.component.ts — Angular 17.2+',lang:'ts',tag:'modern',code:[
      "import { Component, output } from '@angular/core';",
      "",
      "export class ChildComponent {",
      "  saved = output<string>();      // same idea, no EventEmitter",
      "  cancelled = output<void>();",
      "",
      "  save()   { this.saved.emit(this.text); }",
      "  cancel() { this.cancelled.emit(); }",
      "}"]}
  ],
  steps:[
    {t:'Something happens inside the child: a click, a submit, a finished upload.',hl:{chtml:[2]}},
    {t:'The child\u2019s own method runs. So far the parent knows nothing about it.',edge:'e1',hl:{cts:[7,8,9]}},
    {t:'emit() pushes the payload out through the @Output property — the child\u2019s public event.',edge:'e2',hl:{cts:[5]}},
    {t:'The parent template is listening with (saved) and forwards $event into its own method.',edge:'e3',hl:{phtml:[2],pts:[4,5,6]}}
  ],
  example:{
    name:'Search box on an admin users page',
    what:'The search box knows nothing about users, endpoints or tables. It debounces the typing and emits one clean term; the page decides that a term means "call the API again".',
    files:[
      {id:'x1',name:'search-bar.component.ts',lang:'ts',tag:'emitter',code:[
        "export class SearchBarComponent {",
        "  private typed = new Subject<string>();",
        "  @Output() search = new EventEmitter<string>();",
        "",
        "  constructor() {",
        "    this.typed.pipe(",
        "      debounceTime(300),           // wait for a pause",
        "      distinctUntilChanged(),      // ignore 'ab' -> 'ab'",
        "      takeUntilDestroyed(),",
        "    ).subscribe(t => this.search.emit(t));",
        "  }",
        "",
        "  onType(v: string) { this.typed.next(v); }",
        "}"]},
      {id:'x2',name:'users-page.component.html',lang:'html',tag:'the wire',code:[
        "<app-search-bar (search)=\"onSearch($event)\"></app-search-bar>",
        "",
        "<app-user-table [users]=\"users()\"></app-user-table>",
        "",
        "@if (loading()) { <app-spinner></app-spinner> }"]},
      {id:'x3',name:'users-page.component.ts',lang:'ts',tag:'handler',code:[
        "export class UsersPageComponent {",
        "  private api = inject(UserApi);",
        "  users   = signal<User[]>([]);",
        "  loading = signal(false);",
        "",
        "  onSearch(term: string) {      // $event === the emitted string",
        "    this.loading.set(true);",
        "    this.api.list({ q: term }).subscribe(r => {",
        "      this.users.set(r);",
        "      this.loading.set(false);",
        "    });",
        "  }",
        "}"]}
    ]
  },
  gotchas:[
    '<code class="i">$event</code> is whatever you emitted — not a DOM event.',
    'Name the <b>event</b>, not the handler: <code class="i">saved</code>, not <code class="i">onSave</code>. It reads as <code class="i">(saved)</code>.',
    'Outputs only reach the <b>direct parent</b>. For a grandparent: re-emit at each level, or use a service.',
    'If the parent forgets <code class="i">(saved)="..."</code>, emitting does nothing and throws no error.',
    'Never <code class="i">emit()</code> inside <code class="i">ngOnChanges</code> of the same value — that is how infinite loops start.'
  ]
},

/* 04 ------------------------------------------------------- */
{
  analogy:{
    say:`One value, <b>two people allowed to edit it</b> — like a shared shopping list on the fridge. Whoever changes it, both of them are looking at the same list a second later.`,
    strip:[
      {ic:'field', t:`The <b>parent</b> owns the number and shows it to the child.`},
      {ic:'twoway', t:`<b>[(count)]</b> is one wire down plus one wire back up.`},
      {ic:'person', t:`The child changes it, the parent's copy changes too.`}]},
  id:'twoway', num:'04', rail:'[( two-way )]', c:C.down, badge:'Both directions',
  title:'Two-way binding <code>[(value)]</code>',
  lead:'Banana-in-a-box is not magic: it is an @Input plus an @Output glued together by a naming convention. Getting the name wrong is why it silently stops working.',
  nodes:[
    [{id:'pts',role:'owner',file:'parent.component',ext:'.ts',kind:'ts'},
     {id:'phtml',role:'binds both ways',file:'parent.component',ext:'.html',kind:'html'}],
    [{id:'cts',role:'in + out',file:'counter.component',ext:'.ts',kind:'ts'}]
  ],
  edges:[
    {id:'e0',from:'pts',to:'phtml',a:'right',b:'left',label:'count',packet:'0',plain:'the parent\'s number'},
    {id:'e1',from:'phtml',to:'cts',a:'bottom',b:'top',label:'[value]',packet:'0',plain:'goes down as usual'},
    {id:'e2',from:'cts',to:'phtml',a:'right',b:'right',label:'valueChange',packet:'1',plain:'and comes back changed'}
  ],
  files:[
    {id:'pts',name:'parent.component.ts',lang:'ts',tag:'owner',code:[
      "export class ParentComponent {",
      "  count = 0;      // still the single owner of the value",
      "}"]},
    {id:'phtml',name:'parent.component.html',lang:'html',tag:'the wire',code:[
      "<!-- sugar for: [value]=\"count\" (valueChange)=\"count = $event\" -->",
      "<app-counter [(value)]=\"count\"></app-counter>",
      "",
      "<p>Parent sees: {{ count }}</p>"]},
    {id:'cts',name:'counter.component.ts',lang:'ts',tag:'classic',code:[
      "export class CounterComponent {",
      "  @Input() value = 0;",
      "  @Output() valueChange = new EventEmitter<number>();",
      "  //         ^^^^^^^^^^ the name is NOT optional: input + 'Change'",
      "",
      "  inc() {",
      "    this.value++;",
      "    this.valueChange.emit(this.value);   // tell the parent",
      "  }",
      "}"]},
    {id:'mod',name:'counter.component.ts — Angular 17.2+',lang:'ts',tag:'modern',code:[
      "import { Component, model } from '@angular/core';",
      "",
      "export class CounterComponent {",
      "  value = model(0);        // input + output in one signal",
      "",
      "  inc() {",
      "    this.value.update(v => v + 1);   // emits to the parent for you",
      "  }",
      "}"]}
  ],
  steps:[
    {t:'The parent owns the state. Always. The child only borrows it.',hl:{pts:[2]}},
    {t:'Angular reads count from the class into the template binding.',edge:'e0',hl:{phtml:[2]}},
    {t:'The box half of [( )] pushes the value down as a normal @Input.',edge:'e1',hl:{cts:[2]}},
    {t:'The banana half listens to valueChange and writes $event back onto count.',edge:'e2',hl:{cts:[6,7,8],phtml:[4]}}
  ],
  example:{
    name:'Quantity stepper inside a cart row',
    what:'The row owns the line item; the stepper owns the plus/minus buttons and the clamping rules. Two-way binding means the row never writes a (quantityChange) handler — and the line total recomputes on its own.',
    files:[
      {id:'x1',name:'qty-stepper.component.ts',lang:'ts',tag:'the control',code:[
        "export class QtyStepperComponent {",
        "  quantity = model.required<number>();   // in + out, one signal",
        "  max = input(99);",
        "",
        "  dec() { this.quantity.update(q => Math.max(1, q - 1)); }",
        "  inc() { this.quantity.update(q => Math.min(this.max(), q + 1)); }",
        "  // .update() emits to the parent automatically",
        "}"]},
      {id:'x2',name:'cart-row.component.html',lang:'html',tag:'the wire',code:[
        "<span>{{ line.title }}</span>",
        "",
        "<app-qty-stepper [(quantity)]=\"line.qty\" [max]=\"line.stock\"></app-qty-stepper>",
        "",
        "<b>{{ line.qty * line.price | currency }}</b>"]},
      {id:'x3',name:'cart-row.component.ts',lang:'ts',tag:'owner',code:[
        "export class CartRowComponent {",
        "  @Input({ required: true }) line!: CartLine;",
        "",
        "  // classic version of the same child:",
        "  //   @Input()  quantity = 1;",
        "  //   @Output() quantityChange = new EventEmitter<number>();",
        "}"]}
    ]
  },
  gotchas:[
    'The output must be exactly <code class="i">&lt;inputName&gt;Change</code>. <code class="i">value</code> + <code class="i">valueChange</code>.',
    'With <code class="i">model()</code>, calling <code class="i">.set()</code> or <code class="i">.update()</code> emits automatically.',

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const TS_RE = /(\/\/[^\n]*)|('[^']*'|"[^"]*")|(@[A-Za-z]\w*)|\b(import|export|from|class|interface|extends|implements|const|let|var|function|return|new|this|if|else|for|of|in|public|private|protected|readonly|static|async|await|void|string|number|boolean|any|null|undefined|true|false|type|as)\b|(\b\d+\b)/g;
const HT_RE = /(&lt;!--[\s\S]*?--&gt;)|(\{\{[^{}]*\}\})|(&lt;\/?[\w-]+)|("[^"]*")|(\[[\w.$()\-]+\]|\([\w.\-]+\)|#[\w-]+)|(@(?:if|for|else|switch|case|default|empty|defer|placeholder))/g;

function hi(line, lang) {
  const t = esc(line);
  if (lang === 'html') {
    return t.replace(HT_RE, (m, c, i, tag, str, bind, cf) =>
      c ? `<i class="t-com">${c}</i>` :
      i ? `<i class="t-int">${i}</i>` :
      tag ? `<i class="t-tag">${tag}</i>` :
      str ? `<i class="t-str">${str}</i>` :
      bind ? `<i class="t-bind">${bind}</i>` :
      `<i class="t-key">${cf}</i>`);
  }
  return t.replace(TS_RE, (m, c, str, dec, kw, num) =>
    c ? `<i class="t-com">${c}</i>` :
    str ? `<i class="t-str">${str}</i>` :
    dec ? `<i class="t-dec">${dec}</i>` :
    kw ? `<i class="t-key">${kw}</i>` :
    `<i class="t-num">${num}</i>`);
}

/* ---------- quiz banks ----------
   q     the question               opts  the four answers
   code  optional snippets          a     index of the right one

const QUIZ = {

pick: [
{ q:`A <code class="i">&lt;app-user-card&gt;</code> tag is written inside <code class="i">users.component.html</code>. The users page already holds the user object; the card only has to draw it.`,
  opts:[`<b>@Input() / input()</b> — the page binds the value onto the tag`,
        `<b>@Output()</b> — the card asks the page for a user`,
        `A shared service that both of them inject`,
        `A route param in the URL`],
  a:0, go:2,
  why:`The child tag lives inside the parent template and the parent owns the value — that is exactly the job of an input. The page stays the owner, the card only draws what it is handed, which is why the same card also works in search results and in "related products".` },

{ q:`Inside <code class="i">&lt;app-search-box&gt;</code> the user presses Enter. The page around it has to run the search.`,
  opts:[`<b>@Output()</b> with EventEmitter — the box announces it, the page reacts`,
        `<b>@Input()</b> — the page pushes the search term into the box`,
        `The box injects the page component and calls its method`,
        `A route guard on the page`],
  a:0, go:3,
  why:`Data goes down, events come up. The box does not know how to search and should not care — it emits "the user searched for X" and the page decides what that means.` },

{ q:`A quantity stepper: the cart row sets the starting number, and the + / - buttons inside the stepper have to change that same number back in the cart row.`,
  opts:[`Two-way binding — <code class="i">[(quantity)]</code> with <code class="i">model()</code>`,
        `An @Input() only, and mutate the object inside the child`,
        `A shared service just for that one number`,
        `viewChild() from the cart row into the stepper`],
  a:0, go:4,
  why:`<code class="i">[(quantity)]</code> is not a separate feature — it is <code class="i">[quantity]</code> and <code class="i">(quantityChange)</code> written on one line. In Angular 17+ <code class="i">quantity = model(1)</code> gives you both halves from a single line.` },

{ q:`After a save succeeds, the parent has to clear the child form and put the cursor back in the first field.`,
  opts:[`Grab the child with <code class="i">#ref</code> / <code class="i">viewChild()</code> and call <code class="i">child.reset()</code>`,
        `An @Input() reset flag, watched in ngOnChanges`,
        `An @Output() emitted from the parent`,
        `Put the whole form state in a BehaviorSubject`],
  a:0, go:5,
  why:`You are not passing a value — you are asking the child to <b>do</b> something. That is an action, so reach for the instance itself. The flag version works too, but then you have to flip it back, which is how "why did my form reset twice" bugs are born.` },

{ q:`You are writing a reusable <code class="i">&lt;app-panel&gt;</code> that must display whatever markup the page puts between its tags — a heading, a table, a button, anything.`,
  opts:[`<code class="i">&lt;ng-content&gt;</code> — a hole the outer markup drops into`,
        `An @Input() of type string plus innerHTML`,
        `One @Input() for every slot you can think of`,
        `contentChild() on its own`],
  a:0, go:6,
  why:`<code class="i">&lt;ng-content&gt;</code> is a slot. The markup is written and compiled in the <b>outer</b> component, so its bindings and click handlers still belong to that page — the panel only decides where it lands.` },

{ q:`Every <code class="i">&lt;app-tab&gt;</code> has to register itself with the <code class="i">&lt;app-tabs&gt;</code> that wraps it, so opening one closes the others.`,
  opts:[`The tab injects its container: <code class="i">inject(TabsComponent)</code>`,
        `An @Output() on every tab, wired by hand in the template`,
        `A global service holding the open tab id`,
        `A route param per tab`],
  a:0, go:7,
  why:`A child can ask the injector for the component that contains it — Angular walks up the DI tree and hands over the real wrapper instance. No template wiring, and it keeps working however deeply the tab is nested.` },

{ q:`A toast message has to be shown from any page in the app. There is no shared parent to route it through.`,
  opts:[`A service that both sides inject`,
        `An @Output() chain passed up through every component in between`,
        `An @Input() passed down through every component in between`,
        `<code class="i">&lt;ng-content&gt;</code>`],
  a:0, go:8,
  why:`No parent-child relationship means no template wire exists. A service lives in the injector, not in the component tree, so anything in the app reaches the same instance. Threading an event up through five components — prop drilling — is the thing you are avoiding.` },

{ q:`You want shared state that several components read, with no subscribe, no unsubscribe and no async pipe. Angular 17.`,
  opts:[`A service holding <code class="i">signal()</code> and <code class="i">computed()</code>`,
        `A Subject in a service`,
        `A static variable on the class`,
        `localStorage plus a setInterval`],
  a:0, go:9,
  why:`A signal is a value you read like a function — <code class="i">count()</code>. Any template that reads it re-renders itself when it changes, and there is nothing to clean up in ngOnDestroy.` },

{ q:`The orders list navigates to the order detail page. The detail page has to know which order to load.`,
  opts:[`The URL — a route param such as <code class="i">/orders/:id</code>`,
        `An @Input() on the router outlet`,
        `A #ref pointing at the other page`,
        `A variable parked on window`],
  a:0, go:10,
  why:`Two routed pages are never parent and child in a template, so no binding exists between them. Putting the id in the URL also makes the page refreshable, bookmarkable and shareable — none of which a variable gives you.` },

{ q:`A filter sidebar and a results list sit side by side under the same page and must stay in sync.`,
  opts:[`A shared service both inject — or lift the state into the page that holds them`,
        `Bind one sibling straight to the other in the template`,
        `An @Input() from the sidebar to the list`,
        `The list reads the sidebar with viewChild()`],
  a:0, go:8,
  why:`Siblings cannot see each other — there is no template between them. Either lift the state up into the page that holds both and pass it down and back up, or, once more than two components care about it, put it in a service.` }
],

code: [
{ q:`What is the value of <code class="i">title</code> inside the child?`,
  code:[{name:`parent.component.html`,lang:`html`,lines:[
      `<app-child title="Hello"></app-child>`]},
    {name:`child.component.ts`,lang:`ts`,lines:[
      `@Input() title = '';`]}],
  opts:[`The string "Hello"`,
        `undefined — the brackets are missing`,
        `Whatever the parent property named Hello holds`,
        `A compile error`],
  a:0, go:2,
  why:`No brackets means a plain, static string. <code class="i">[title]="Hello"</code> would instead go looking for a <b>property</b> called Hello on the parent class — and quietly find nothing.` },

{ q:`What does this log?`,
  code:[{name:`child.component.ts`,lang:`ts`,lines:[
      `export class ChildComponent {`,
      `  @Input() user!: User;`,
      ``,
      `  constructor() {`,

        `It throws — user has no initial value`],
  a:0, go:2,
  why:`Angular builds the class first and assigns the inputs afterwards. The earliest safe place to read one is <code class="i">ngOnInit</code>; use <code class="i">ngOnChanges</code>, a setter, or an <code class="i">effect()</code> with signal inputs if you also need later values.` },

{ q:`The user clicks, <code class="i">send()</code> runs. What does the parent see?`,
  code:[{name:`child.component.ts`,lang:`ts`,lines:[
      `@Output() saved = new EventEmitter<string>();`,
      ``,
      `send() { this.saved.emit('ok'); }`]},
    {name:`parent.component.html`,lang:`html`,lines:[
      `<app-child></app-child>`]}],
  opts:[`Nothing at all — nobody is listening`,
        `It receives 'ok'`,
        `A runtime error about a missing handler`,
        `'ok', but only on the next change detection pass`],
  a:0, go:3,
  why:`An emit with no listener is silent by design. The parent has to bind the event: <code class="i">&lt;app-child (saved)="onSaved($event)"&gt;</code> — and the emitted value arrives as <code class="i">$event</code>.` },

{ q:`For this line to compile and actually work, what must the child expose?`,
  code:[{name:`parent.component.html`,lang:`html`,lines:[
      `<app-counter [(count)]="total"></app-counter>`]}],
  opts:[`<code class="i">count = model(0)</code> — or @Input() count plus @Output() countChange`,
        `An @Input() named count, nothing else`,
        `An @Output() named count, nothing else`,
        `@Input() count plus @Output() changed`],
  a:0, go:4,
  why:`Angular expands <code class="i">[(count)]</code> into <code class="i">[count]</code> and <code class="i">(countChange)</code>. The output name is the input name plus the word Change, spelled exactly — <code class="i">changed</code> will not do.` },

{ q:`What happens on the first render?`,
  code:[{name:`form.component.ts`,lang:`ts`,lines:[
      `@ViewChild('box') box!: ElementRef;`,
      ``,
      `ngOnInit() {`,
      `  this.box.nativeElement.focus();`,
      `}`]}],
  opts:[`It throws — box is still undefined in ngOnInit`,
        `The input gets focused`,
        `Nothing happens, silently`,
        `It focuses only on the second render`],
  a:0, go:5,
  why:`View queries are filled in once the template has been created, which is <code class="i">ngAfterViewInit</code>. The signal form <code class="i">box = viewChild&lt;ElementRef&gt;('box')</code> is safer — read it inside an <code class="i">effect()</code> and it runs when the element really exists.` },

{ q:`ChildComponent is standalone and is not listed in <code class="i">imports</code>. What do you get on screen?`,
  code:[{name:`parent.component.ts`,lang:`ts`,lines:[
      `@Component({`,
      `  selector: 'app-parent',`,
      `  imports: [],`,
      `  template: '<app-child></app-child>',`,
      `})`,
      `export class ParentComponent {}`]}],
  opts:[`An empty area — the unknown tag renders nothing`,
        `The child renders normally`,
        `The whole app fails to start`,
        `The child renders once, then disappears`],
  a:0, go:2,
  why:`Angular treats a tag it does not know as plain HTML: nothing appears, nothing obviously breaks. Dev mode logs an "is not a known element" warning that is very easy to scroll past — so check the imports array first whenever a component has "vanished".` },

{ q:`Two sibling components inject CartService, and one of them carries this providers line. What do they share?`,
  code:[{name:`cart.service.ts`,lang:`ts`,lines:[
      `@Injectable({ providedIn: 'root' })`,
      `export class CartService { items = signal<Item[]>([]); }`]},
    {name:`cart-badge.component.ts`,lang:`ts`,lines:[
      `@Component({`,
      `  selector: 'app-cart-badge',`,
      `  providers: [CartService],   // <-- here`,

  opts:[`Nothing — the component with providers gets its own private copy`,
        `The same instance; providedIn: 'root' wins`,
        `The same instance, but only after the first change`,
        `It throws: the service is provided twice`],
  a:0, go:8,
  why:`A service listed in a component's <code class="i">providers</code> is created fresh for that component and its children, and it shadows the root one. Delete the line and both siblings resolve to the single root instance. This is the number one cause of "my service forgot the value".` },

{ q:`B subscribes after A has already emitted. What is logged?`,
  code:[{name:`chat.service.ts`,lang:`ts`,lines:[
      `private sub = new Subject<string>();`,
      `msg$ = this.sub.asObservable();`,
      ``,
      `// A — runs on app start`,

      ``,
      `// B — a component created a second later`,

        `undefined`,
        `'hi', once for every subscriber`],
  a:0, go:8,
  why:`A plain <code class="i">Subject</code> has no memory: it only forwards what happens after you subscribe. <code class="i">new BehaviorSubject('')</code> keeps the latest value and hands it to every new subscriber immediately — which is what shared state almost always wants.` },

{ q:`The screen shows one item, then <code class="i">add()</code> runs. What renders?`,
  code:[{name:`list.component.ts`,lang:`ts`,lines:[

  a:0, go:9,

{ q:`You are on <code class="i">/user/1</code> and click a link to <code class="i">/user/2</code>. What do you see?`,

],

fix: [
{ q:`An <code class="i">&lt;app-child&gt;</code> tag renders nothing at all and nothing is thrown. What do you check first?`,

{ q:`An <code class="i">@Input() config</code> read in the constructor is always undefined. Smallest correct fix?`,

{ q:`The child runs <code class="i">this.user.name = 'Ali'</code> and the parent's object changes too. Why?`,

{ q:`The parent binds <code class="i">(saved)="onSaved($event)"</code>, the handler runs, but <code class="i">$event</code> is always undefined.`,

{ q:`Data arrives from an HTTP call, but the template throws <code class="i">Cannot read properties of undefined</code> before it does.`,

};

const LETTER = ['A', 'B', 'C', 'D'];

const qcodeBlock = c => `
  <div class="qcode">
    ${c.name ? `<div class="qcf">${c.name}</div>` : ''}
    <pre>${c.lines.map(l => `<span class="ln">${hi(l, c.lang) || ' '}</span>`).join('')}</pre>
  </div>`;

function buildQuiz(s) {
  const bank = QUIZ[s.bank];
  return `<div class="quiz" data-bank="${s.bank}">
    <div class="qbar">
      <span class="qtxt"><b class="qdone">0</b> / ${bank.length} answered</span>
      <div class="qmeter"><i></i></div>
      <span class="qtxt"><em class="qright">0</em> right</span>
      <button class="iconbtn" data-reset>&#8635; Reset</button>
    </div>` +
    bank.map((q, i) => `
    <div class="qcard" data-q="${i}">
      <div class="qhead"><span class="qnum">Q${String(i + 1).padStart(2, '0')}</span><span class="qask">${q.q}</span></div>
      ${(q.code || []).map(qcodeBlock).join('')}
      <div class="opts">${q.opts.map((o, k) =>
        `<button class="opt" data-o="${k}"><span class="k">${LETTER[k]}</span><span class="ot">${o}</span><span class="mark"></span></button>`).join('')}</div>
      <div class="why" hidden>
        <span class="wt">why</span><p>${q.why}</p>
        ${q.go ? `<button class="iconbtn" data-go="${q.go}">Open ${SLIDES[q.go].num} &nbsp;&rarr;</button>` : ''}
      </div>
    </div>`).join('') + `
    <div class="qend" hidden>
      <b class="sc"></b><p></p>
      <div class="revs"></div>
      <button class="iconbtn" data-reset>&#8635; Try again</button>
    </div>
  </div>`;
}

const exampleBlock = x => `
  <div class="example">
    <div class="exhead"><span class="extag">Real example</span><b>${x.name}</b></div>
    <p class="exlead">${x.what}</p>
    <div class="files">${x.files.map(codeCard).join('')}</div>
  </div>`;

function buildPattern(s) {
  const rows = s.nodes.map(r => `<div class="row">${r.map(nodeBox).join('')}</div>`).join('');
  const svg = `<svg><g class="edges">${s.edges.map(e =>
    `<g class="edge" data-edge="${e.id}"><path class="wire"></path><path class="head"></path><path class="flow"></path><text></text><text class="plain"></text></g>`).join('')}
    <g class="packet"><rect></rect><text></text></g></g></svg>`;
  return `
    ${s.analogy ? stripBlock(s.analogy) : ''}
    <div class="stage">${svg}${rows}</div>
    <div class="stepbar">
      <div class="dots">${s.steps.map((_, i) => `<button class="dot" data-step="${i}" aria-label="step ${i + 1}"></button>`).join('')}</div>
      <div class="cap"></div>
      <button class="iconbtn" data-replay>&#9654; Replay</button>
    </div>
    <div class="files">${s.files.map(codeCard).join('')}</div>
    ${s.example ? exampleBlock(s.example) : ''}
    <div class="gotchas"><h4>Watch out</h4><ul>${s.gotchas.map(g => `<li>${g}</li>`).join('')}</ul></div>`;
}

/* ---------- build the deck ---------- */
const viewport = $('#viewport'), rail = $('#rail');
SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.style.setProperty('--c', s.c);
  el.dataset.i = i;
  let head = '';
  if (s.kind !== 'title') {
    head = `<div class="eyebrow"><span class="num">${s.num}</span>${s.badge ? `<span class="badge">${s.badge}</span>` : ''}</div>
            <h1 class="title">${s.title}</h1><p class="lead">${s.lead}</p>`;
  }
  const body = s.kind === 'title' ? buildTitle()
    : s.kind === 'map' ? buildMap()
    : s.kind === 'table' ? buildTable()
    : s.kind === 'debug' ? buildDebug()
    : s.kind === 'quiz' ? buildQuiz(s)
    : buildPattern(s);
  el.innerHTML = head + body;
  viewport.appendChild(el);

  const b = document.createElement('button');
  b.className = 'rail-btn';
  b.innerHTML = `<em>${i ? String(i).padStart(2, '0') : '&bull;'}</em><span>${s.rail}</span>`;
  b.onclick = () => goSlide(i);
  rail.appendChild(b);
});
const slideEls = [...viewport.querySelectorAll('.slide')];
const railBtns = [...rail.querySelectorAll('.rail-btn')];

/* ---------- edge geometry ---------- */
function anchorPt(r, side, base) {
  const x = r.left - base.left, y = r.top - base.top, w = r.width, h = r.height;
  if (side === 'left') return { x: x, y: y + h / 2, nx: -1, ny: 0 };
  if (side === 'right') return { x: x + w, y: y + h / 2, nx: 1, ny: 0 };
  if (side === 'top') return { x: x + w / 2, y: y, nx: 0, ny: -1 };
  return { x: x + w / 2, y: y + h, nx: 0, ny: 1 };
}

const SVGNS = 'http://www.w3.org/2000/svg';

/* Write text on a wire without a node ever covering it: one line if it fits,
   otherwise two balanced lines, and only then shrink. */
function fitLabel(t, text, size, room, y, dir) {
  t.style.fontSize = '';
  t.textContent = text;
  t.setAttribute('y', y);
  if (!text || room === Infinity || t.getComputedTextLength() <= room) return;

  let widest = t.getComputedTextLength();
  const words = text.split(' ');
  if (words.length > 1) {
    let cut = 1, best = Infinity;
    for (let i = 1; i < words.length; i++) {
      const d = Math.abs(words.slice(0, i).join(' ').length - words.slice(i).join(' ').length);
      if (d < best) { best = d; cut = i; }
    }
    const lines = [words.slice(0, cut).join(' '), words.slice(cut).join(' ')];
    const x = t.getAttribute('x');
    t.textContent = '';
    lines.forEach((ln, i) => {
      const sp = document.createElementNS(SVGNS, 'tspan');
      sp.setAttribute('x', x);
      sp.setAttribute('y', dir === 'up' ? y - (1 - i) * size * 1.15 : y + i * size * 1.15);
      sp.textContent = ln;
      t.appendChild(sp);
    });
    widest = Math.max(...[...t.childNodes].map(sp => sp.getComputedTextLength()));
  }
  if (widest > room) t.style.fontSize = Math.max(8, size * room / widest).toFixed(2) + 'px';
}

function layout(el) {
  const s = SLIDES[+el.dataset.i];
  if (!s.edges) return;
  const stage = $('.stage', el), svg = $('svg', el);
  if (!stage) return;
  const base = stage.getBoundingClientRect();
  svg.setAttribute('width', base.width);
  svg.setAttribute('height', base.height);
  s.edges.forEach(e => {
    const a = $(`[data-node="${e.from}"]`, el), b = $(`[data-node="${e.to}"]`, el);
    if (!a || !b) return;
    const p1 = anchorPt(a.getBoundingClientRect(), e.a, base);
    const p2 = anchorPt(b.getBoundingClientRect(), e.b, base);
    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const k = Math.max(40, Math.min(140, d * 0.45));
    const c1x = p1.x + p1.nx * k, c1y = p1.y + p1.ny * k;
    const c2x = p2.x + p2.nx * k, c2y = p2.y + p2.ny * k;
    const g = $(`[data-edge="${e.id}"]`, el);
    const wire = $('.wire', g), flow = $('.flow', g), head = $('.head', g), txt = $('text', g);
    const dd = `M${p1.x},${p1.y} C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}`;
    wire.setAttribute('d', dd);
    flow.setAttribute('d', dd);
    // arrow head, aimed along the tangent at the end
    const L = wire.getTotalLength();
    const end = wire.getPointAtLength(Math.max(0, L - 1));
    const pre = wire.getPointAtLength(Math.max(0, L - 12));
    const ang = Math.atan2(end.y - pre.y, end.x - pre.x);
    const A = 0.42, r = 9;
    head.setAttribute('d',
      `M${end.x},${end.y} L${end.x - r * Math.cos(ang - A)},${end.y - r * Math.sin(ang - A)} L${end.x - r * Math.cos(ang + A)},${end.y - r * Math.sin(ang + A)} Z`);
    const mid = wire.getPointAtLength(L * 0.5);
    const plain = $('text.plain', g);
    // a wire drawn straight across a row only has the gap between the two
    // boxes to write in; anywhere else there is open space
    const inRow = (e.a === 'right' && e.b === 'left') || (e.a === 'left' && e.b === 'right');
    const room = inRow ? Math.abs(p2.x - p1.x) - 6 : Infinity;
    [txt, plain].forEach(t => { t.setAttribute('x', mid.x); t.setAttribute('text-anchor', 'middle'); });
    fitLabel(txt, e.label, 10.5, room, mid.y - 9, 'up');
    fitLabel(plain, room < 80 ? '' : (e.plain || ''), 9.5, room, mid.y + 15, 'down');
  });
}

/* ---------- animation ---------- */
let RUN = 0, cur = 0, step = 0;

function fly(el, edgeId, token) {
  return new Promise(res => {
    const g = $(`[data-edge="${edgeId}"]`, el);
    const wire = $('.wire', g);
    const pk = $('.packet', el), rect = $('rect', pk), txt = $('text', pk);
    const e = SLIDES[+el.dataset.i].edges.find(x => x.id === edgeId);
    txt.textContent = e.packet || e.label;
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('y', 4);
    txt.setAttribute('x', 0);
    const w = Math.max(38, txt.getComputedTextLength() + 20);
    rect.setAttribute('x', -w / 2); rect.setAttribute('y', -12);
    rect.setAttribute('width', w); rect.setAttribute('height', 24);
    rect.setAttribute('rx', 7);
    const L = wire.getTotalLength();
    if (REDUCED || !L) { pk.style.opacity = 0; return res(); }
    const dur = 900, t0 = performance.now();
    (function frame(now) {
      if (token !== RUN) { pk.style.opacity = 0; return res(); }
      const t = Math.min(1, (now - t0) / dur);
      const q = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const p = wire.getPointAtLength(q * L);
      pk.setAttribute('transform', `translate(${p.x},${p.y})`);
      pk.style.opacity = t < .1 ? t / .1 : t > .9 ? (1 - t) / .1 : 1;
      if (t < 1) requestAnimationFrame(frame);
      else { pk.style.opacity = 0; res(); }
    })(performance.now());
  });
}

function paint(el, s, i) {
  $$('.hl', el).forEach(n => n.classList.remove('hl'));
  $$('.fc.active,.node.active', el).forEach(n => n.classList.remove('active'));
  $$('.dot', el).forEach((d, k) => d.classList.toggle('on', k === i));
  $('.cap', el).innerHTML = `<span>${String(i + 1).padStart(2, '0')}/${String(s.steps.length).padStart(2, '0')}</span>${s.steps[i].t}`;
  s.edges.forEach(e => {
    const lit = s.steps.slice(0, i + 1).some(st => st.edge === e.id);
    $(`[data-edge="${e.id}"]`, el).classList.toggle('lit', lit);
  });
  const st = s.steps[i], touched = new Set();
  Object.entries(st.hl || {}).forEach(([fid, lines]) => {
    const card = $(`[data-file="${fid}"]`, el);
    if (card) { card.classList.add('active'); lines.forEach(l => { const n = $(`[data-l="${l}"]`, card); if (n) n.classList.add('hl'); }); }
    touched.add(fid);
  });
  if (st.edge) { const e = s.edges.find(x => x.id === st.edge); touched.add(e.from); touched.add(e.to); }
  touched.forEach(id => { const n = $(`[data-node="${id}"]`, el); if (n) n.classList.add('active'); });
}

async function goStep(i, animate = true) {
  const el = slideEls[cur], s = SLIDES[cur];
  if (!s.steps) return;
  step = Math.max(0, Math.min(s.steps.length - 1, i));
  const token = ++RUN;
  paint(el, s, step);
  if (animate && s.steps[step].edge) await fly(el, s.steps[step].edge, token);
}

async function play() {
  const s = SLIDES[cur], el = slideEls[cur];
  if (!s.steps) return;
  const token = ++RUN;
  for (let i = 0; i < s.steps.length; i++) {
    if (token !== RUN) return;
    step = i;
    paint(el, s, i);
    if (s.steps[i].edge) await fly(el, s.steps[i].edge, token);
    else await new Promise(r => setTimeout(r, REDUCED ? 0 : 620));
    if (token !== RUN) return;
    if (i < s.steps.length - 1) await new Promise(r => setTimeout(r, REDUCED ? 0 : 520));
  }
}

function goSlide(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  step = 0; RUN++;
  slideEls.forEach((el, k) => el.classList.toggle('on', k === cur));
  railBtns.forEach((b, k) => b.setAttribute('aria-current', k === cur));
  viewport.scrollTop = 0;
  $('#pos').textContent = `${String(cur + 1).padStart(2, '0')} / ${SLIDES.length}`;
  $('#barfill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  const el = slideEls[cur];
  requestAnimationFrame(() => { layout(el); if (SLIDES[cur].steps) play(); });
  try { railBtns[cur].scrollIntoView({ block: 'nearest' }); } catch (_) {}
}

function next() {
  const s = SLIDES[cur];
  if (s.steps && step < s.steps.length - 1) { RUN++; goStep(step + 1); }
  else if (cur < SLIDES.length - 1) goSlide(cur + 1);
}
function prev() {
  const s = SLIDES[cur];
  if (s.steps && step > 0) { RUN++; goStep(step - 1, false); }
  else if (cur > 0) goSlide(cur - 1);
}

/* ---------- quiz engine ---------- */
function scoreQuiz(quiz) {
  const bank = QUIZ[quiz.dataset.bank];
  const cards = $$('.qcard', quiz);
  const done = cards.filter(c => c.classList.contains('done')).length;
  const right = cards.filter(c => c.classList.contains('right')).length;
  $('.qdone', quiz).textContent = done;
  $('.qright', quiz).textContent = right;
  $('.qmeter i', quiz).style.width = (done / bank.length * 100) + '%';

  const end = $('.qend', quiz);
  if (done < bank.length) { end.hidden = true; return; }
  const pct = right / bank.length;
  $('.sc', end).textContent = `${right} / ${bank.length}`;
  $('p', end).textContent =
    pct === 1 ? 'Every one right. You can explain this section to somebody else now.'
    : pct >= .7 ? 'Solid. Re-open the slides below for the ones that got away.'
    : 'Worth another pass — open the slides below, then hit Try again.';
  const missed = [...new Set(cards.filter(c => c.classList.contains('wrong'))
    .map(c => QUIZ[quiz.dataset.bank][+c.dataset.q].go).filter(Boolean))];
  $('.revs', end).innerHTML = missed.map(g =>
    `<button class="iconbtn" data-go="${g}">${SLIDES[g].rail}</button>`).join('');
  end.hidden = false;
}

function answer(btn) {
  const card = btn.closest('.qcard');
  if (card.classList.contains('done')) return;
  const quiz = card.closest('.quiz');
  const q = QUIZ[quiz.dataset.bank][+card.dataset.q];
  const pick = +btn.dataset.o;
  card.classList.add('done', pick === q.a ? 'right' : 'wrong');
  $$('.opt', card).forEach((o, k) => {
    if (k === q.a) o.classList.add('ok');
    else if (k === pick) o.classList.add('no');
  });
  $('.why', card).hidden = false;
  scoreQuiz(quiz);
}

function resetQuiz(quiz) {
  $$('.qcard', quiz).forEach(c => {
    c.classList.remove('done', 'right', 'wrong');
    $$('.opt', c).forEach(o => o.classList.remove('ok', 'no'));
    $('.why', c).hidden = true;
  });
  scoreQuiz(quiz);
  viewport.scrollTop = 0;
}

/* keys 1-4 answer the first question you have not done yet */
function quizKey(n) {
  const el = slideEls[cur];
  const card = $('.qcard:not(.done)', el);
  if (!card) return;
  const opt = $$('.opt', card)[n - 1];
  if (!opt) return;
  answer(opt);
  const nextCard = $('.qcard:not(.done)', el);
  (nextCard || $('.qend', el)).scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' });
}

/* ---------- events ---------- */
$('#next').onclick = next;
$('#prev').onclick = prev;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (SLIDES[cur].kind === 'quiz' && k >= '1' && k <= '4') { e.preventDefault(); return quizKey(+k); }
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'n' || k === 'N') goSlide(cur + 1);
  else if (k === 'p' || k === 'P') goSlide(cur - 1);
  else if (k === 'Home') goSlide(0);
  else if (k === 'End') goSlide(SLIDES.length - 1);
  else if (k.toLowerCase() === 'r') play();
});
viewport.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) return goSlide(+go.dataset.go);
  const opt = e.target.closest('.opt');
  if (opt) return answer(opt);
  const rst = e.target.closest('[data-reset]');
  if (rst) return resetQuiz(rst.closest('.quiz'));
  const dot = e.target.closest('.dot');
  if (dot) { RUN++; return goStep(+dot.dataset.step); }
  if (e.target.closest('[data-replay]')) play();
});
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => layout(slideEls[cur]), 140); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(slideEls[cur]));

goSlide(0);

</script></body></html>
